<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Form creation</title>
</head>
<body>
    <form action="">
        Name :
        <input type="text" placeholder="Name"><br><br>

        Qualification :

        <br>

            <option>+91</option>

              <option>-92</option>

        <input type="tel" size="10" maxlength="10">
        <br>
        <input type="Submit">
        <input type="Reset">

    </form>
    
</body>
</html>
