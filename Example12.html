<!-- Example 12: CSS ID Selector
HTML: -->
<style>
#title{
    color:purple;
    text-align:center;
}
</style>

<h1 id="title">CSS Tutorial</h1>

#title is an ID selector used for one unique element.
Summary of Common CSS Properties

margin	Space outside border	margin:20px;

    property: value;
} -->
